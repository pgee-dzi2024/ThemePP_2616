{% extends 'main/base.html' %}

{% block title %}Нова кампания{% endblock %}

{% block content %}
<div id="app">
    <div class="card">
        <h1>Създаване на кампания</h1>
        <a class="btn btn-secondary" href="/">← Назад</a>
    </div>

    <div class="card">
        <div v-if="message" class="alert alert-success">[[ message ]]</div>
        <div v-if="error" class="alert alert-danger">[[ error ]]</div>

        <div class="form-group">
            <label>Име</label>
            <input class="form-control" v-model="form.name" type="text">
        </div>

        <div class="form-group">
            <label>Тема</label>
            <input class="form-control" v-model="form.subject" type="text">
        </div>

        <div class="form-group">
            <label>Тип съдържание</label>
            <select class="form-control" v-model="form.content_type">
                <option value="text">Текст</option>
                <option value="html">HTML</option>
            </select>
        </div>

        <div class="form-group">
            <label>Съдържание</label>
            <textarea class="form-control" v-model="form.content" rows="10"></textarea>
        </div>

        <button class="btn btn-success" @click="createCampaign">Създай кампания</button>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const { createApp } = Vue;

createApp({
    delimiters: ['[[', ']]'],
    data() {
        return {
            form: {
                name: '',
                subject: '',
                content: '',
                content_type: 'text'
            },
            error: '',
            message: ''
        }
    },
    methods: {
        async createCampaign() {
            this.error = '';
            this.message = '';

            try {
                const response = await axios.post('/api/campaigns/', this.form);
                this.message = 'Кампанията е създадена успешно.';
                window.location.href = '/campaigns/' + response.data.id + '/';
            } catch (err) {
                this.error = 'Грешка при създаване на кампанията.';
            }
        }
    }
}).mount('#app');
</script>
{% endblock %}
